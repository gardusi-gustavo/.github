name: Feature request
description: Propose a bounded improvement
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or painful?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, and what is explicitly out of scope?
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: How should the change be tested?
    validations:
      required: false
