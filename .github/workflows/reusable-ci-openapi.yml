name: ci-openapi
on:
  workflow_call:
    inputs:
      command:
        type: string
        default: |
          set -euo pipefail
          npx --yes @redocly/cli@latest lint openapi.yaml
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run
        run: ${{ inputs.command }}
