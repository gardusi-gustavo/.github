name: ingest

# Runs inside the database repository. The built-in GITHUB_TOKEN is enough:
# the workflow pushes a branch and opens a pull request in the same repository.
on:
  workflow_call:
    inputs:
      domain:
        type: string
        required: true
      max_days:
        type: number
        default: 7
      max_files:
        type: number
        default: 500
      max_bytes:
        type: number
        default: 52428800

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build dataset
        env:
          DOMAIN: ${{ inputs.domain }}
        run: |
          day="$(date -u +%F)"
          bash infra/scripts/ingest.sh --date "$day" --output "$RUNNER_TEMP/dataset.json"

      - name: Update rolling branch
        env:
          DOMAIN: ${{ inputs.domain }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          day="$(date -u +%F)"
          branch="data/$DOMAIN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git checkout -B "$branch" "origin/$branch"
            git merge --no-edit origin/main
          else
            git checkout -B "$branch" origin/main
          fi
          mkdir -p "data/$DOMAIN"
          cp "$RUNNER_TEMP/dataset.json" "data/$DOMAIN/$day.json"
          git add "data/$DOMAIN/$day.json"
          if git diff --cached --quiet; then
            echo "no data change"
            exit 0
          fi
          git commit -m "data($DOMAIN): $day"
          git push origin "$branch"

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOMAIN: ${{ inputs.domain }}
          MAX_DAYS: ${{ inputs.max_days }}
          MAX_FILES: ${{ inputs.max_files }}
          MAX_BYTES: ${{ inputs.max_bytes }}
        run: |
          set -euo pipefail
          branch="data/$DOMAIN"
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number,createdAt,changedFiles,additions --jq '.[0] // empty')"
          body="Rolling ingestion for $DOMAIN.

          - One open pull request per domain
          - Human approval required
          - Squash merge only
          - Cap: ${MAX_DAYS} days, ${MAX_FILES} files, ${MAX_BYTES} bytes"

          if [[ -z "$existing" ]]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "data($DOMAIN): rolling ingestion" --body "$body"
            exit 0
          fi

          number="$(jq -r .number <<<"$existing")"
          created="$(jq -r .createdAt <<<"$existing")"
          files="$(jq -r .changedFiles <<<"$existing")"
          bytes="$(jq -r .additions <<<"$existing")"
          age_days=$(( ( $(date -u +%s) - $(date -u -d "$created" +%s) ) / 86400 ))
          if (( age_days > MAX_DAYS || files > MAX_FILES || bytes > MAX_BYTES )); then
            gh pr comment "$number" --repo "$GITHUB_REPOSITORY" --body "Ingestion cap reached: age=${age_days}d files=${files} bytes=${bytes}. Stop ingestion and merge or reset."
            exit 1
          fi
          gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
