name: event-ci

on:
  workflow_call:
    inputs:
      script:
        description: Repository-specific test entrypoint
        type: string
        default: "scripts/test.sh"
      timeout:
        description: Job timeout in minutes
        type: number
        default: 20

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect container
        id: container
        run: |
          container="$(jq -r '.ci.container // false' infra/config/repo.json 2>/dev/null || echo false)"
          if [ -f infra/docker/ci.dockerfile ] && [ "$container" = "true" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Build CI image
        if: steps.container.outputs.present == 'yes'
        run: docker build -f infra/docker/ci.dockerfile -t ci .

      - name: Test in container
        if: steps.container.outputs.present == 'yes'
        run: |
          set -euo pipefail
          if [ -x "${{ inputs.script }}" ]; then
            command="bash ${{ inputs.script }}"
          else
            command="$(jq -r '.ci.command // .ci.script // empty' infra/config/repo.json 2>/dev/null || true)"
          fi
          if [ -z "$command" ]; then
            echo "container present but neither ${{ inputs.script }} nor a ci command exists"
            exit 1
          fi
          docker run --rm -v "$PWD:/work" -w /work ci bash -lc "git config --global --add safe.directory /work && $command"

      - name: Test from script
        if: steps.container.outputs.present == 'no' && hashFiles(inputs.script) != ''
        run: bash "${{ inputs.script }}"

      - name: Test from repository config
        if: steps.container.outputs.present == 'no' && hashFiles(inputs.script) == ''
        run: |
          set -euo pipefail
          command="$(jq -r '.ci.command // .ci.script // empty' infra/config/repo.json 2>/dev/null || true)"
          if [ -z "$command" ]; then
            echo "no ${{ inputs.script }} and no .ci.command in infra/config/repo.json"
            exit 1
          fi
          bash -lc "$command"
