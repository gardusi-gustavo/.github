name: ci-lua
on:
  workflow_call:
    inputs:
      command:
        type: string
        default: |
          set -euo pipefail
          luarocks make
          busted
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v4
      - name: Run
        run: ${{ inputs.command }}
